<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verification Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="form-content">
      <div class="image">
        <img
          src="Assets/pexels-michelangelo-buonarroti-8728561.jpg"
          alt="Sign Up Image"
        />
      </div>
      <div class="main-content">
        <a href="#">
          <svg
            class="back"
            xmlns="http://www.w3.org/2000/svg"
            version="1.1"
            width="24"
            height="24"
            viewBox="0 0 24 24"
          >
            <path
              d="M21 11.016v1.969h-14.156l3.563 3.609-1.406 1.406-6-6 6-6 1.406 1.406-3.563 3.609h14.156z"
            />
          </svg>
        </a>
        <!--Verification title-->
        <h1 class="title">Verification Code</h1>

        <!--Verification call to action-->
        <p class="login-link">
          We sent a varification code on <span>...gagodo@gmail.com</span>
        </p>

        <!--Verification form-->
        <form action="#">
          <div class="verification-code">
            <p class="code1"><span>4</span></p>
            <p class="code">0</p>
            <p class="code">0</p>
            <p class="code">0</p>
          </div>
          <div class="resend-time">Resend code in <span>00:24</span></div>

          <div class="button">
            <input type="submit" value="Verify Code" />
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
